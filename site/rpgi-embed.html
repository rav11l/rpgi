<style>
#rpgi-live { --bg: #fbfaf7; --surface: #ffffff; --ink: #15181c; --ink-2: #4a5058; --muted: #7b8189; --rule: #e4e1da; --grid: #efece6;

  background: var(--surface); color: var(--ink); font: 400 14.5px/1.55 var(--sans); padding: 28px; display: grid; gap: 12px; box-sizing: border-box; min-width: 0; }
#rpgi-live[hidden] { display: none; }
#rpgi-live.in-grid { grid-column: 1 / -1; }
#rpgi-live *, #rpgi-live *::before { box-sizing: border-box; }
#rpgi-live .rl-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px 24px; flex-wrap: wrap; border-bottom: 1px solid var(--rule); padding-bottom: 12px; }
#rpgi-live .rl-eyebrow { font: 600 11px/1.4 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
#rpgi-live .rl-status { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 12px; color: var(--muted); margin-top: 4px; }
#rpgi-live .rl-badge { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
#rpgi-live .rl-badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--context); }
#rpgi-live .rl-badge[data-live="1"]::before { background: #0ca30c; }
#rpgi-live .rl-tabs { display: flex; flex-wrap: wrap; border: 1px solid var(--rule); }
#rpgi-live .rl-tabs button, #rpgi-live .rl-years button { font: 500 12.5px var(--sans); padding: 6px 12px; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; margin: 0; border-radius: 0; }
#rpgi-live .rl-tabs button[aria-selected="true"] { background: var(--ink); color: var(--surface); }
#rpgi-live .rl-years { display: flex; flex-wrap: wrap; border: 1px solid var(--rule); width: max-content; max-width: 100%; }
#rpgi-live .rl-years button { font-variant-numeric: tabular-nums; padding: 5px 10px; }
#rpgi-live .rl-years button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
#rpgi-live button:focus-visible, #rpgi-live svg:focus-visible, #rpgi-live summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#rpgi-live .rl-pane { display: grid; gap: 8px; min-width: 0; }
#rpgi-live .rl-pane[hidden] { display: none; }
#rpgi-live h4 { font: 600 18px/1.3 var(--serif); margin: 4px 0 0; color: var(--ink); text-wrap: balance; }
#rpgi-live .sub { font-size: 12.5px; color: var(--muted); margin: -2px 0 0; }
#rpgi-live .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--ink-2); }
#rpgi-live .legend i { display: inline-block; width: 16px; height: 2px; vertical-align: middle; margin-right: 6px; }
#rpgi-live .legend i.bar { height: 10px; width: 10px; }
#rpgi-live .note { font-size: 12.5px; color: var(--ink); margin: 0; font-variant-numeric: tabular-nums; }
#rpgi-live .chart { position: relative; min-width: 0; }
#rpgi-live .chart svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
#rpgi-live .chart text { font-family: var(--sans); font-variant-numeric: tabular-nums; }
#rpgi-live .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--rule); box-shadow: 0 4px 14px rgb(0 0 0 / .08);
  padding: 8px 10px; font-size: 12.5px; line-height: 1.45; min-width: 150px; z-index: 5; font-variant-numeric: tabular-nums; }
#rpgi-live .tip[hidden] { display: none; }
#rpgi-live .tip b { display: block; font-weight: 600; margin-bottom: 2px; }
#rpgi-live .tip .row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
#rpgi-live .tip .row span:first-child { color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
#rpgi-live .tip .row i { width: 12px; height: 2px; display: inline-block; }
#rpgi-live .tip .row strong { font-weight: 600; color: var(--ink); }
#rpgi-live .limit { font-size: 12.5px; color: var(--ink-2); border-top: 1px solid var(--rule); padding-top: 10px; margin: 2px 0 0; }
#rpgi-live .limit b { font-weight: 600; color: var(--ink); }
#rpgi-live details { font-size: 12.5px; color: var(--ink-2); }
#rpgi-live summary { cursor: pointer; color: var(--accent); width: max-content; }
#rpgi-live .tbl { overflow: auto; margin-top: 8px; max-height: 260px; }
#rpgi-live table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
#rpgi-live th, #rpgi-live td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
#rpgi-live th:first-child, #rpgi-live td:first-child { text-align: left; }
#rpgi-live th { font-weight: 600; color: var(--ink); position: sticky; top: 0; background: var(--surface); }
#rpgi-live tr.me td { color: var(--ink); font-weight: 600; }
@media (max-width: 640px) { #rpgi-live { padding: 20px 16px; } }

  const W0 = Math.max(300, host.clientWidth), x = i => pad.l + (W0 - pad.l - pad.r) * (n === 1 ? .5 : i / (n - 1));

  const y = v => pad.t + (H - pad.t - pad.b) * (1 - v / top);
  let hair, dots = [];
  const { svg, W } = frame(host, H, pad, n, x, (i, s) => {
    hair.setAttribute("opacity", i < 0 ? 0 : 1); if (i < 0) return;
    hair.setAttribute("x1", x(i)); hair.setAttribute("x2", x(i)); const r = d[i];
    const bb = s.getBoundingClientRect(), sx = bb.width / W;
    showTip(host, x(i) * sx, y(r.gap) * sx, String(r.year), [[t.kzn, fmt(r.gap) + " %", A], [t.med, fmt(r.med) + " %", C],
      [t.rank, `${r.rank} / ${r.n}`], [t.ratio, fmt(r.ratio, 2) + "×"]]);
  }, t.c1);
  yAxis(svg, W, pad, ticks, y);
  hair = el("line", { y1: pad.t, y2: H - pad.b, stroke: css("--muted"), "stroke-width": 1, opacity: 0 }, svg);
  const path = (k, col) => el("path", { d: d.map((r, i) => (i ? "L" : "M") + x(i) + " " + y(r[k])).join(""), fill: "none", stroke: col, "stroke-width": 2, "stroke-linejoin": "round", class: "mark" }, svg);
  path("med", C); path("gap", A);
  d.forEach((r, i) => { el("circle", { cx: x(i), cy: y(r.med), r: 3.5, fill: C, stroke: css("--surface"), "stroke-width": 2 }, svg);
    el("circle", { cx: x(i), cy: y(r.gap), r: 4.5, fill: A, stroke: css("--surface"), "stroke-width": 2 }, svg);
    text(svg, x(i), H - pad.b + 18, String(r.year), { "text-anchor": "middle", fill: css("--ink-2") });
    text(svg, x(i), H - pad.b + 34, `${r.rank}/${r.n}`, { "text-anchor": "middle", "font-size": 11 }); });
  const last = d[n - 1];
  text(svg, x(n - 1) + 10, y(last.gap) + 4, `${t.kzn} ${fmt(last.gap)}`, { fill: css("--ink"), "font-weight": 600 });
  text(svg, x(n - 1) + 10, y(last.med) + 4, `${t.med.split(" ")[0]} ${fmt(last.med)}`, { fill: css("--ink-2") });
  table("t1", [t.year, t.kzn + ", %", t.med + ", %", t.rank, t.ratio], d.map(r => [r.year, fmt(r.gap, 2), fmt(r.med, 2), `${r.rank} / ${r.n}`, fmt(r.ratio, 2)]));
}

// ---------- график 2: все центры за год ----------
function chart2() {
  const host = $("rl-ch2"), t = T[lang]; const A = css("--mark"), C = css("--context");
  $("rl-h-all").textContent = t.c2(year);
  const yb = $("rl-years"); yb.replaceChildren(); yb.setAttribute("aria-label", t.year);
  data.years.forEach(Y => { const b = document.createElement("button"); b.type = "button"; b.id = "rl-y" + Y; b.textContent = Y;
    b.setAttribute("aria-pressed", Y === year); b.onclick = () => { year = Y; chart2(); }; yb.appendChild(b); });
  legend("lg2", [[t.kzn, A, "bar"], [t.others, C, "bar"]]);
  const d = data.rows.filter(r => r.year === year).sort((a, b) => b.gap - a.gap), n = d.length, med = d[0].med;
  const H = 300, pad = { l: 44, r: 12, t: 26, b: 24 };
  const W0 = Math.max(300, host.clientWidth), bw = (W0 - pad.l - pad.r) / n, x = i => pad.l + bw * (i + .5);
  const lo = Math.min(0, ...d.map(r => r.gap)), hi = Math.max(...d.map(r => r.gap));
  const ticks = niceTicks(lo, hi, 5), y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const y = v => pad.t + (H - pad.t - pad.b) * (1 - (v - y0) / (y1 - y0));
  const bars = [];
  const { svg, W } = frame(host, H, pad, n, x, (i, s) => {
    bars.forEach((b, j) => b.setAttribute("opacity", i < 0 || j === i ? 1 : .45)); if (i < 0) return;
    const r = d[i], sx = s.getBoundingClientRect().width / W;
    showTip(host, x(i) * sx, Math.min(y(r.gap), y(0)) * sx, city(r.centre), [[t.gap, fmt(r.gap) + " %", r.centre === ME ? A : C], [t.rank, `${r.rank} / ${r.n}`], [t.ratio, fmt(r.ratio, 2) + "×"]]);
  }, t.c2(year));
  yAxis(svg, W, pad, ticks, y);
  const gap = bw > 5 ? 2 : bw > 3 ? 1 : 0;
  d.forEach((r, i) => { const top = Math.min(y(r.gap), y(0)), h = Math.max(1, Math.abs(y(r.gap) - y(0)));
    bars.push(el("rect", { x: pad.l + bw * i + gap / 2, y: top, width: Math.max(1, bw - gap), height: h, rx: Math.min(2, bw / 4), fill: r.centre === ME ? A : C, class: "mark" }, svg)); });
  el("line", { x1: pad.l, x2: W - pad.r, y1: y(med), y2: y(med), stroke: css("--ink-2"), "stroke-width": 1, "stroke-dasharray": "4 3" }, svg);
  text(svg, W - pad.r, y(med) - 6, `${t.median} ${fmt(med)} %`, { "text-anchor": "end", fill: css("--ink-2") });
  const k = d.findIndex(r => r.centre === ME);
  if (k >= 0) { const r = d[k], ty = Math.min(y(r.gap), y(0)) - 8;
    text(svg, Math.min(Math.max(x(k), pad.l + 40), W - pad.r - 60), ty, `${t.kzn} · ${fmt(r.gap)} % · ${r.rank}/${n}`, { "text-anchor": k > n * .6 ? "end" : "start", fill: css("--ink"), "font-weight": 600 }); }
  table("t2", ["#", t.centre, t.gap], d.map(r => [r.rank, city(r.centre), fmt(r.gap, 2)]), i => d[i].centre === ME);
}

// ---------- график 3: доля ДДУ ----------
function chart3() {
  const host = $("rl-ch3"), d = data.ddu, t = T[lang]; const A = css("--mark"), C = css("--context");
  legend("lg3", [[t.rt, A], [t.rf, C]]);
  const H = 280, pad = { l: 44, r: 16, t: 14, b: 30 }, n = d.length;
  const W0 = Math.max(300, host.clientWidth), x = i => pad.l + (W0 - pad.l - pad.r) * i / (n - 1);
  const hi = Math.max(...d.map(r => Math.max(r.rf, r.rt ?? 0))), ticks = niceTicks(0, hi, 5), top = ticks[ticks.length - 1];
  const y = v => pad.t + (H - pad.t - pad.b) * (1 - v / top);
  let hair;
  const lab = r => `${MSHORT[lang][r.m - 1]} ${r.y}`;
  const { svg, W } = frame(host, H, pad, n, x, (i, s) => {
    hair.setAttribute("opacity", i < 0 ? 0 : 1); if (i < 0) return;
    hair.setAttribute("x1", x(i)); hair.setAttribute("x2", x(i)); const r = d[i], sx = s.getBoundingClientRect().width / W;
    showTip(host, x(i) * sx, y(Math.max(r.rf, r.rt ?? 0)) * sx, lab(r), [[t.rt, r.rt == null ? "—" : fmt(r.rt) + " %", A], [t.rf, fmt(r.rf) + " %", C]]);
  }, t.c3);
  yAxis(svg, W, pad, ticks, y);
  d.forEach((r, i) => { if (r.m === 1) { el("line", { x1: x(i), x2: x(i), y1: H - pad.b, y2: H - pad.b + 4, stroke: css("--context") }, svg);
    if (W > 520 || r.y % 2 === 1) text(svg, x(i), H - pad.b + 17, String(r.y), { "text-anchor": "middle", fill: css("--ink-2") }); } });
  hair = el("line", { y1: pad.t, y2: H - pad.b, stroke: css("--muted"), "stroke-width": 1, opacity: 0 }, svg);
  const line = (k, col) => { let p = "", on = false; d.forEach((r, i) => { if (r[k] == null) { on = false; return; } p += (on ? "L" : "M") + x(i) + " " + y(r[k]); on = true; });
    el("path", { d: p, fill: "none", stroke: col, "stroke-width": 2, "stroke-linejoin": "round" }, svg); };
  line("rf", C); line("rt", A);
  const fi = d.findIndex(r => r.y === 2026 && r.m === 2);
  if (fi > 0) { const a = d[fi], b = d[fi - 1];
    el("circle", { cx: x(fi), cy: y(a.rt), r: 4.5, fill: A, stroke: css("--surface"), "stroke-width": 2 }, svg);
    text(svg, x(fi) - 8, y(a.rt) + 18, t.febShort, { "text-anchor": "end", fill: css("--ink"), "font-weight": 600 });
    $("rl-n3").textContent = t.feb(signed(a.rt - b.rt), signed(a.rf - b.rf)); }
  const L = d[n - 1];
  el("circle", { cx: x(n - 1), cy: y(L.rt), r: 3.5, fill: A, stroke: css("--surface"), "stroke-width": 2 }, svg);
  table("t3", [t.month, t.rt + ", %", t.rf + ", %"], d.slice().reverse().map(r => [lab(r), r.rt == null ? "—" : fmt(r.rt), fmt(r.rf)]));
}

// ---------- сборка блока ----------
let tab = 0;
const siteLang = () => (document.documentElement.getAttribute("lang") || "ru").toLowerCase().startsWith("en") ? "en" : "ru";
function render() {
  lang = siteLang(); const t = T[lang];
  ROOT.querySelectorAll("[data-i]").forEach(e => { const v = t[e.dataset.i]; if (typeof v === "string") { if (v.includes("<b>")) e.innerHTML = v; else e.textContent = v; } });
  $("rl-src").textContent = live ? t.live : t.snap; $("rl-src").dataset.live = live ? "1" : "0";
  const u = data.updated ? new Date(data.updated + "T00:00:00").toLocaleDateString(lang === "ru" ? "ru-RU" : "en-GB", { day: "numeric", month: "long", year: "numeric" }) : "—";
  $("rl-upd").textContent = `${t.upd}: ${u}`;
  ROOT.querySelectorAll(".rl-tabs button").forEach((b, i) => { b.textContent = t.tabs[i]; b.setAttribute("aria-selected", i === tab); b.tabIndex = i === tab ? 0 : -1; });
  ROOT.querySelectorAll(".rl-pane").forEach((p, i) => { p.hidden = i !== tab; });
  [chart1, chart2, chart3][tab]();
}
ROOT.querySelectorAll(".rl-tabs button").forEach((b, i) => {
  b.onclick = () => { tab = i; render(); };
  b.onkeydown = e => { if (e.key === "ArrowRight" || e.key === "ArrowLeft") { e.preventDefault(); tab = (tab + (e.key === "ArrowRight" ? 1 : 2)) % 3; render(); ROOT.querySelectorAll(".rl-tabs button")[tab].focus(); } };
});
// Встать под рядом с карточкой RPGI в сетке инструментов (если её нет — остаться на месте)
(function place() {
  const tag = [...document.querySelectorAll(".tools > article .tag")].find(e => /^\s*RPGI\b/.test(e.textContent));
  const art = tag && tag.closest("article");
  if (art) { art.insertAdjacentElement("afterend", ROOT); ROOT.classList.add("in-grid"); }
  ROOT.hidden = false;
})();
let rt; new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(render, 80); }).observe(ROOT);
new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ["lang", "data-lang"] });

data = build(SNAPSHOT); year = data.years[data.years.length - 1]; render();
loadLive().then(raw => { data = build(raw); live = true; if (!data.years.includes(year)) year = data.years[data.years.length - 1]; render(); }).catch(() => {});
})();
</script>
