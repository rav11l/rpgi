<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WP-2026-07 — Налог на непроданное жильё</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/golos-text/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/golos-text/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/golos-text/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-serif-4/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-serif-4/400-italic.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-serif-4/600.css">
<style>
  @page { size: A4; margin: 20mm 20mm 20mm 20mm; }
  :root { --ink:#1b1f24; --muted:#5b6470; --accent:#2a63b8; --rule:#d5dae1; --box:#f3f5f8; }
  html { font-family: "Source Serif 4", Georgia, serif; font-size: 10.6pt; line-height: 1.5; color: var(--ink); background:#fff; }
  body { margin:0; }
  h1,h2,h3,.sans { font-family: "Golos Text", Arial, sans-serif; }
  .top { display:flex; justify-content:space-between; font-family:"Golos Text",sans-serif; font-size:7.5pt; letter-spacing:.18em; color:var(--accent); font-weight:600; text-transform:uppercase; border-bottom:1px solid var(--rule); padding-bottom:6px; }
  h1 { font-size: 19pt; line-height:1.2; margin: 18px 0 6px; font-weight:700; }
  .subtitle { font-style: italic; color: var(--muted); font-size: 11pt; margin-bottom: 12px; }
  .author { margin: 0 0 14px; line-height:1.4; }
  .author b { font-weight:600; }
  .box { background: var(--box); border-top: 2px solid var(--accent); padding: 10px 16px 8px; margin: 12px 0 14px; }
  .label { font-family:"Golos Text",sans-serif; font-size:7.5pt; letter-spacing:.18em; color:var(--accent); font-weight:600; text-transform:uppercase; margin: 14px 0 4px; }
  .box .label { margin-top: 2px; }
  .box ol { margin: 4px 0 4px 18px; padding:0; }
  .box li { margin-bottom: 4px; }
  p { margin: 0 0 8px; text-align: left; hyphens: auto; }
  h2 { font-size: 12.5pt; margin: 20px 0 8px; font-weight:700; break-after: avoid; }
  h3 { font-size: 10.8pt; margin: 14px 0 6px; font-weight:600; break-after: avoid; }
  .abstract-en { font-size: 9.6pt; }
  .meta { font-size: 9.2pt; color: var(--ink); }
  .eq { display:flex; justify-content:center; align-items:baseline; margin: 8px 0 10px; font-size: 10.8pt; position:relative; }
  .eq .n { position:absolute; right:0; color:var(--muted); font-size:9.5pt; }
  i.v { font-style: italic; }
  .claim { border-left: 3px solid var(--accent); background: var(--box); padding: 8px 14px; margin: 10px 0 12px; break-inside: avoid; }
  .claim b { font-family:"Golos Text",sans-serif; font-weight:600; }
  table { border-collapse: collapse; width:100%; font-size: 9.3pt; margin: 6px 0 4px; break-inside: avoid; }
  th, td { border: 1px solid var(--rule); padding: 6px 8px; vertical-align: top; text-align:left; }
  th { font-family:"Golos Text",sans-serif; font-weight:600; background: var(--box); font-size:8.6pt; }
  .cap { font-family:"Golos Text",sans-serif; font-size: 8.8pt; font-weight:600; margin: 12px 0 2px; break-after: avoid; }
  .note { font-size: 8.6pt; color: var(--muted); margin-bottom: 10px; }
  ol.refs { font-size: 9.2pt; padding-left: 20px; }
  ol.refs li { margin-bottom: 3px; }
  .small { font-size: 9.2pt; }
  .end { font-size: 9pt; color: var(--muted); }
</style>
</head>
